[workspace]
authors = ["mattjmeier <matthew.meier@hc-sc.gc.ca>"]
channels = ["conda-forge"]
name = "BioTooltipR"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[activation.env]
R_LIBS_USER = "NULL"

[target.win-64.activation]
scripts = ["scripts/activate-rtools.bat"]

[tasks]
# Render the Plotly browser-regression fixture and run the Playwright suite.
# Skips cleanly when playwright-core or a Chromium executable is unavailable.
test-browser = "Rscript tests/browser/render-fixture.R && node tests/browser/run-tests.mjs"

[dependencies]
r-base = ">=4.3.0"
r-devtools = ">=2.5.2,<3"
r-dt = ">=0.34.0,<0.35"
r-jsonlite = ">=1.8.0"
r-remotes = ">=2.5.0,<3"
r-rmarkdown = ">=2.27"
r-htmltools = ">=0.5.9,<0.6"
r-plotly = ">=4.12.0,<5"
r-testthat = ">=3.3.2,<4"
r-roxygen2 = ">=8.1.0"