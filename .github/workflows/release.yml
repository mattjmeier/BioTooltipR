name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to create a release for
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Resolve tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release from NEWS.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          version="${tag#v}"

          # Extract the "# BioTooltipR <version>" section from NEWS.md
          awk -v ver="$version" '
            $0 == "# BioTooltipR " ver { found = 1; next }
            found && /^# / { exit }
            found { print }
          ' NEWS.md > release-notes.md

          if [ -s release-notes.md ]; then
            gh release create "$tag" \
              --verify-tag \
              --title "BioTooltipR $version" \
              --notes-file release-notes.md \
              --latest
          else
            echo "::warning::No NEWS.md section for $version; creating release without notes"
            gh release create "$tag" --verify-tag --title "BioTooltipR $version" --latest
          fi
